
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Designs | Felix Ameyaw Designs</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#080808;
    color:white;
    font-family:Arial,sans-serif;
}

header {
    padding:25px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    border-bottom:1px solid #292929;
}

.logo {
    color:#d6b45c;
    font-size:22px;
    font-weight:bold;
    letter-spacing:2px;
}

nav a {
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:14px;
}

nav a:hover, nav a.active { color:#d6b45c; }

.intro {
    text-align:center;
    padding:75px 20px 50px;
}

.intro h1 {
    font-size:clamp(32px,5vw,55px);
    margin-bottom:15px;
}

.intro h1 span { color:#d6b45c; }

.intro p { color:#aaa; line-height:1.8; }

.gold-line {
    width:65px;
    height:3px;
    background:#d6b45c;
    margin:22px auto;
}

.gallery {
    padding:20px 8% 80px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.design-card {
    background:#151515;
    border:1px solid #292929;
    border-radius:10px;
    overflow:hidden;
    transition:.3s;
}

.design-card:hover {
    transform:translateY(-7px);
    border-color:#d6b45c;
}

.design-card img {
    width:100%;
    height:300px;
    object-fit:contain;
    display:block;
    background:#111;
    cursor:pointer;
}

.design-info {
    text-align:center;
    padding:18px;
    color:#d6b45c;
}

footer {
    text-align:center;
    padding:25px;
    border-top:1px solid #292929;
    color:#777;
    font-size:13px;
}

#lightbox {
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.95);
    justify-content:center;
    align-items:center;
    padding:20px;
}

#lightbox img {
    max-width:95%;
    max-height:90vh;
    object-fit:contain;
}

#lightbox span {
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    cursor:pointer;
}

@media(max-width:800px) {
    .gallery { grid-template-columns:repeat(2,1fr); }
}

@media(max-width:550px) {
    header { justify-content:center; text-align:center; }
    nav a { margin:0 7px; }
    .gallery { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header>
    <div class="logo">FELIX AMEYAW</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="designs.html" class="active">Designs</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="intro">
    <h1>MY <span>CREATIVE DESIGNS</span></h1>
    <div class="gold-line"></div>
    <p>Explore my collection of creative and professional designs.</p>
</section>

<section class="gallery">

    <div class="design-card">
        <img src="design1.jpg.jpg" alt="Design 1" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 01</div>
    </div>

    <div class="design-card">
        <img src="design2.jpg.jpg" alt="Design 2" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 02</div>
    </div>

    <div class="design-card">
        <img src="design3.jpg.jpg" alt="Design 3" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 03</div>
    </div>

    <div class="design-card">
        <img src="design4.jpg.jpeg" alt="Design 4" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 04</div>
    </div>

    <div class="design-card">
        <img src="design5.jpg.jpg" alt="Design 5" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 05</div>
    </div>

    <div class="design-card">
        <img src="design6.jpg.jpg" alt="Design 6" onclick="openImage(this.src)">
        <div class="design-info">DESIGN 06</div>
    </div>

</section>

<footer>
    © 2026 Felix Ameyaw Designs. All Rights Reserved.
</footer>

<div id="lightbox" onclick="closeImage()">
    <span>&times;</span>
    <img id="lightbox-img" src="" alt="Full design">
</div>

<script>
function openImage(src) {
    document.getElementById("lightbox-img").src = src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeImage() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
